<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>10.000 Steps</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="10.000 Steps">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
/* Layout: iOS-style grouped list on a grey ground. One big ring for you, compact rows for friends. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fg:#000000; --fg2:#3c3c43; --fg3:rgba(60,60,67,.6); --sep:rgba(60,60,67,.18);
  --fill:#e5e5ea; --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500; --ring-track:#e9e9ee;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#000000; --card:#1c1c1e; --fg:#ffffff; --fg2:#ebebf5; --fg3:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
    --fill:#2c2c2e; --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --ring-track:#2c2c2e; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-block:8px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:34px;font-weight:800;letter-spacing:-.4px;margin:18px 0 2px}
.sub{color:var(--fg3);font-size:15px;margin:0 0 18px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3);margin:26px 0 8px 16px;font-weight:600}
.card{background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px}
.row+.row{border-top:.5px solid var(--sep);}
.row .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:13px;color:var(--fg3);display:block;font-weight:400;margin-top:1px}
.row .steps{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;text-align:right}
.row .steps small{display:block;font-size:12px;color:var(--fg3);font-weight:500}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;letter-spacing:.02em}
.pill.ok{background:var(--green)} .pill.no{background:var(--red)} .pill.stale{background:var(--orange)}
.hero{padding:26px 16px 22px;text-align:center}
.ring{position:relative;width:190px;height:190px;margin:0 auto 12px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--ring-track);stroke-width:18}
.ring .bar{fill:none;stroke:var(--green);stroke-width:18;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.3,.9,.3,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:40px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
.ring .num span{font-size:13px;color:var(--fg3);margin-top:6px;font-weight:500}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:19px;margin-top:4px}
.status .dot{width:12px;height:12px;border-radius:50%;background:var(--red)}
.status.ok .dot{background:var(--green)}
.hero .meta{color:var(--fg3);font-size:14px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;
  font:inherit;font-weight:600;font-size:17px;cursor:pointer;background:var(--blue);color:#fff}
.btn.sec{background:var(--fill);color:var(--blue)}
.btn.plain{background:transparent;color:var(--blue);padding:12px}
.btn:active{opacity:.7}
.btn[disabled]{opacity:.5}
.stack{display:flex;flex-direction:column;gap:10px}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:0;background:var(--card);color:var(--fg);border-radius:0;outline:0}
input::placeholder{color:var(--fg3)}
.field+.field{border-top:.5px solid var(--sep)}
.hint{font-size:13px;color:var(--fg3);margin:8px 16px 0}
.mini{width:34px;height:34px;flex:none}
.mini svg{width:34px;height:34px;transform:rotate(-90deg)}
.mini .track{fill:none;stroke:var(--ring-track);stroke-width:5}
.mini .bar{fill:none;stroke-width:5;stroke-linecap:round}
.days{display:flex;gap:4px;margin-top:4px}
.days i{width:8px;height:8px;border-radius:50%;background:var(--fill);display:block}
.days i.ok{background:var(--green)} .days i.no{background:var(--red)}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;
  transition:all .25s;pointer-events:none;white-space:nowrap;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.nav button{background:none;border:0;color:var(--blue);font:inherit;font-size:17px;padding:8px 0;cursor:pointer}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--fill);padding:12px 14px;border-radius:12px;
  word-break:break-all;user-select:all;-webkit-user-select:all;line-height:1.45}
.step{display:flex;gap:14px;padding:14px 16px}
.step+.step{border-top:.5px solid var(--sep)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.step .t{flex:1;min-width:0;font-size:15px}
.step .t b{display:block;font-size:16px;margin-bottom:3px}
.step .t p{margin:4px 0 0;color:var(--fg2)}
.step .t .k{display:inline-block;background:var(--fill);border-radius:6px;padding:1px 7px;font-weight:600;font-size:14px}
.empty{padding:28px 16px;text-align:center;color:var(--fg3);font-size:15px}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.ok{color:var(--green)} .chip.warn{color:var(--orange)}
@media (prefers-reduced-motion:reduce){.ring .bar{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://kxrbeyecsdvejhvxtrin.supabase.co';
const SUPA_KEY = 'sb_publishable_FD2i1tEYUWO1RAgtOoESiA_VPt3zUOk';
const SYNC_URL = SUPA_URL + '/functions/v1/steps-sync';
const GOAL = 10000;

const $ = s => document.querySelector(s);
const app = $('#app');
const fmt = n => (n||0).toLocaleString('de-DE');
let me = null, dash = [], hist = [], timer = null, view = 'home';

function load(){ try{ me = JSON.parse(localStorage.getItem('steps_me')||'null'); }catch(e){ me=null; } }
function save(){ try{ localStorage.setItem('steps_me', JSON.stringify(me)); }catch(e){} }

async function rpc(fn, args){
  const r = await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`, {
    method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},
    body: JSON.stringify(args||{})
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Kopiert'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Kopiert');}catch(_){ toast('Bitte manuell kopieren'); } ta.remove(); }
}

/* ---------- time helpers (step day runs 03:00 → 03:00 Europe/Berlin) ---------- */
function berlinNow(){
  const p = new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const h = +p.find(x=>x.type==='hour').value, m=+p.find(x=>x.type==='minute').value;
  return {h,m};
}
function timeLeft(){
  const {h,m} = berlinNow();
  let mins = (h<3 ? (3-h)*60 : (27-h)*60) - m;
  const hh=Math.floor(mins/60), mm=mins%60;
  return hh>0 ? `${hh} Std. ${mm} Min.` : `${mm} Min.`;
}
function ago(ts){
  if(!ts) return 'noch nie synchronisiert';
  const d=(Date.now()-new Date(ts).getTime())/60000;
  if(d<1) return 'gerade eben'; if(d<60) return `vor ${Math.round(d)} Min.`;
  if(d<48*60) return `vor ${Math.round(d/60)} Std.`; return `vor ${Math.round(d/1440)} Tagen`;
}
const isStale = ts => !ts || (Date.now()-new Date(ts).getTime()) > 2*3600e3;

/* ---------- views ---------- */
function ringSVG(pct, cls, r=80, big=true){
  const c=2*Math.PI*r, off=c*(1-Math.min(pct,1));
  return `<svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="${r}"/><circle class="bar" cx="100" cy="100" r="${r}" style="stroke:${cls};stroke-dasharray:${c};stroke-dashoffset:${big?c:off}" data-off="${off}"/></svg>`;
}

function renderJoin(prefillGroup){
  view='join';
  app.innerHTML = `
    <h1>10.000 Steps</h1>
    <p class="sub">Schaffst du heute 10.000 Schritte? Du und deine Freunde, jeden Tag bis 3 Uhr nachts.</p>
    <div class="card">
      <div class="field"><input id="name" placeholder="Dein Name" autocomplete="given-name" maxlength="24"></div>
      <div class="field"><input id="group" placeholder="Gruppencode (z. B. buero)" autocapitalize="none" autocomplete="off" maxlength="24" value="${prefillGroup||''}"></div>
    </div>
    <p class="hint">Gleicher Gruppencode = gleiche Gruppe. Erfinde einen neuen oder nimm den, den du bekommen hast.</p>
    <div class="stack" style="margin-top:18px">
      <button class="btn" id="joinBtn">Loslegen</button>
    </div>`;
  $('#joinBtn').onclick = async ()=>{
    const name=$('#name').value.trim(), group=$('#group').value.trim().toLowerCase().replace(/[^a-z0-9äöü_-]/g,'');
    if(!name||!group){ toast('Name und Gruppencode eingeben'); return; }
    const b=$('#joinBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
    try{ me = await rpc('steps_join',{p_name:name,p_group_code:group}); save(); history.replaceState(null,'',location.pathname); renderHome(); renderSetup(); }
    catch(e){ toast('Fehler: '+e.message); b.disabled=false; b.textContent='Loslegen'; }
  };
}

async function refresh(){
  if(!me) return;
  try{
    [dash,hist] = await Promise.all([rpc('steps_dashboard',{p_group_code:me.group_code}), rpc('steps_history',{p_group_code:me.group_code})]);
    if(view==='home') renderHome();
  }catch(e){ console.warn(e); }
}

function dayDots(userId){
  const days=[]; const base=new Date(Date.now()-3*3600e3);
  for(let i=6;i>=1;i--){ const d=new Date(base); d.setDate(d.getDate()-i); days.push(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin'}).format(d)); }
  return `<div class="days">${days.map(d=>{const r=hist.find(h=>h.user_id===userId&&h.day===d); return `<i class="${r?(r.steps>=GOAL?'ok':'no'):''}"></i>`;}).join('')}</div>`;
}

function renderHome(){
  view='home';
  const my = dash.find(d=>d.id===me.id) || {steps:0,updated_at:null,goal_reached:false};
  const pct = my.steps/GOAL;
  const others = dash.filter(d=>d.id!==me.id);
  const stale = isStale(my.updated_at);
  app.innerHTML = `
    <div class="nav"><span style="font-weight:700;font-size:17px">10.000 Steps</span><button id="setupBtn">Einrichten</button></div>
    <div class="card hero">
      <div class="ring">${ringSVG(pct, my.goal_reached?'var(--green)':'var(--red)')}
        <div class="num"><b>${fmt(my.steps)}</b><span>von ${fmt(GOAL)} Schritten</span></div></div>
      <div class="status ${my.goal_reached?'ok':''}"><span class="dot"></span>${my.goal_reached?'Geschafft!':`Noch ${fmt(GOAL-my.steps)} Schritte`}</div>
      <div class="meta">${my.goal_reached?'Ziel für heute erreicht':'Noch '+timeLeft()+' bis 3:00 Uhr'}</div>
      <div style="margin-top:14px">${stale
        ? `<span class="chip warn">⚠︎ Sync ${ago(my.updated_at)}</span>`
        : `<span class="chip ok">✓ Sync ${ago(my.updated_at)}</span>`}</div>
      ${dayDots(me.id)}
    </div>

    <div class="section-title">Freunde · ${me.group_code}</div>
    <div class="card">
      ${others.length ? others.map(o=>`
        <div class="row">
          <div class="mini">${ringSVG(o.steps/GOAL, o.goal_reached?'var(--green)':'var(--red)', 80, false)}</div>
          <div class="name">${esc(o.name)}<span class="meta">${isStale(o.updated_at)?'⚠︎ ':''}Sync ${ago(o.updated_at)}</span>${dayDots(o.id)}</div>
          <div class="steps">${fmt(o.steps)}<small>${o.goal_reached?'✓ geschafft':'noch '+fmt(GOAL-o.steps)}</small></div>
          <span class="pill ${o.goal_reached?'ok':'no'}">${o.goal_reached?'GRÜN':'ROT'}</span>
        </div>`).join('')
      : `<div class="empty">Noch niemand hier. Lade Freunde mit dem Gruppencode <b>${esc(me.group_code)}</b> ein.</div>`}
    </div>
    <div class="stack" style="margin-top:14px">
      <button class="btn sec" id="inviteBtn">Freunde einladen</button>
      <button class="btn plain" id="manualBtn">Schritte manuell eintragen</button>
    </div>
    <p class="hint center" style="margin-top:20px">Hallo ${esc(me.name)} · <a href="#" id="logout" style="color:var(--fg3)">Abmelden</a></p>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ document.querySelectorAll('.ring .bar').forEach(b=>b.style.strokeDashoffset=b.dataset.off); }));
  $('#setupBtn').onclick=renderSetup;
  $('#inviteBtn').onclick=invite;
  $('#manualBtn').onclick=manual;
  $('#logout').onclick=e=>{e.preventDefault(); me=null; try{localStorage.removeItem('steps_me')}catch(_){}; renderJoin(); };
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function invite(){
  const url = location.origin+location.pathname+'?g='+encodeURIComponent(me.group_code);
  const text = `Komm in meine 10.000-Steps-Gruppe! Gruppencode: ${me.group_code}\n${url}`;
  if(navigator.share){ try{ await navigator.share({title:'10.000 Steps',text}); return; }catch(e){} }
  copy(text);
}

async function manual(){
  const v = prompt('Wie viele Schritte hast du heute?');
  if(v==null) return;
  const n = parseInt(String(v).replace(/\D/g,''),10); if(isNaN(n)) return;
  try{ await fetch(`${SYNC_URL}?token=${me.token}&steps=${n}`); toast('Gespeichert'); refresh(); }catch(e){ toast('Fehler beim Speichern'); }
}

function renderSetup(){
  view='setup';
  const url = `${SYNC_URL}?token=${me.token}&steps=`;
  app.innerHTML = `
    <div class="nav"><button id="back">‹ Zurück</button><span></span></div>
    <h1 style="font-size:28px">Apple Health verbinden</h1>
    <p class="sub">Ein Kurzbefehl schickt deine Schritte automatisch hierher. Einmal einrichten, dann läuft es von allein.</p>

    <div class="section-title">Deine persönliche Sync-Adresse</div>
    <div class="card" style="padding:14px 16px">
      <div class="code" id="urlbox">${url}</div>
      <button class="btn sec" style="margin-top:12px" id="copyUrl">Adresse kopieren</button>
    </div>
    <p class="hint">Diese Adresse ist dein Schlüssel. Nicht weitergeben.</p>

    <div class="section-title">Kurzbefehl anlegen (ca. 3 Minuten)</div>
    <div class="card">
      <div class="step"><div class="n">1</div><div class="t"><b>Kurzbefehle-App öffnen</b><p>Oben rechts auf <span class="k">+</span> tippen. Oben den Namen auf <span class="k">10.000 Steps</span> ändern.</p></div></div>
      <div class="step"><div class="n">2</div><div class="t"><b>Aktion „Datum“ hinzufügen</b><p>Suche nach <span class="k">Datum</span>. Es steht automatisch „Aktuelles Datum“.</p></div></div>
      <div class="step"><div class="n">3</div><div class="t"><b>Aktion „Datum anpassen“ (3×)</b><p>Füge „Datum anpassen“ dreimal hintereinander ein und stelle ein:<br>① <span class="k">Subtrahieren</span> 3 Stunden<br>② <span class="k">Tagesanfang abrufen</span><br>③ <span class="k">Hinzufügen</span> 3 Stunden<br>Das sorgt dafür, dass dein Tag erst um 3 Uhr nachts endet.</p></div></div>
      <div class="step"><div class="n">4</div><div class="t"><b>Aktion „Gesundheitsdaten suchen“</b><p>Typ: <span class="k">Schritte</span>. Bei „Filter“: <span class="k">Startdatum</span> <span class="k">ist nach</span> → Variable <span class="k">Angepasstes Datum</span> (die letzte). Sortieren: keine. Limit: aus.</p></div></div>
      <div class="step"><div class="n">5</div><div class="t"><b>Aktion „Statistik berechnen“</b><p><span class="k">Summe</span> von <span class="k">Gesundheitsdaten</span>.</p></div></div>
      <div class="step"><div class="n">6</div><div class="t"><b>Aktion „Text“</b><p>Füge deine Sync-Adresse von oben ein und direkt dahinter (ohne Leerzeichen) die Variable <span class="k">Statistik</span>.</p></div></div>
      <div class="step"><div class="n">7</div><div class="t"><b>Aktion „Inhalt der URL abrufen“</b><p>URL: der <span class="k">Text</span> von Schritt 6. Methode: GET. Fertig – oben auf „Fertig“ tippen.</p></div></div>
      <div class="step"><div class="n">8</div><div class="t"><b>Einmal testen</b><p>Kurzbefehl antippen und ausführen. Beim ersten Mal fragt iOS nach Health-Zugriff → <span class="k">Erlauben</span>. Danach hier unten prüfen.</p></div></div>
    </div>

    <div class="section-title">Automatisch laufen lassen</div>
    <div class="card">
      <div class="step"><div class="n">9</div><div class="t"><b>Automation anlegen</b><p>In Kurzbefehle unten auf <span class="k">Automation</span> → <span class="k">+</span>. Trigger auswählen, dann <span class="k">Sofort ausführen</span> und „Bei Ausführung benachrichtigen“ <b>aus</b>. Als Aktion den Kurzbefehl „10.000 Steps“ wählen.</p></div></div>
      <div class="step"><div class="n">10</div><div class="t"><b>Empfohlene Trigger</b><p>Lege am besten drei Automationen an:<br>• <span class="k">App</span> → WhatsApp, Instagram, Safari „ist geöffnet“ (läuft dann quasi ständig)<br>• <span class="k">Ladegerät</span> → wird angeschlossen<br>• <span class="k">Tageszeit</span> → 21:00, täglich (Sicherheitsnetz)</p></div></div>
    </div>

    <div class="section-title">Status</div>
    <div class="card" style="padding:16px">
      <div id="syncstatus">Prüfe…</div>
      <button class="btn sec" style="margin-top:12px" id="checkBtn">Jetzt prüfen</button>
    </div>
    <div class="stack" style="margin-top:16px"><button class="btn" id="done">Zum Dashboard</button></div>`;
  $('#back').onclick=$('#done').onclick=()=>{renderHome(); refresh();};
  $('#copyUrl').onclick=()=>copy(url);
  $('#checkBtn').onclick=checkSync;
  checkSync();
}

async function checkSync(){
  const el=$('#syncstatus'); if(!el) return;
  try{
    const d = await rpc('steps_dashboard',{p_group_code:me.group_code});
    const my = d.find(x=>x.id===me.id);
    if(!my||!my.updated_at) el.innerHTML='<span class="chip warn">Noch kein Sync angekommen</span><p class="hint" style="margin:10px 0 0">Führe den Kurzbefehl einmal aus und tippe dann auf „Jetzt prüfen“.</p>';
    else el.innerHTML=`<span class="chip ok">✓ Letzter Sync ${ago(my.updated_at)}</span><p class="hint" style="margin:10px 0 0">${fmt(my.steps)} Schritte heute angekommen. Alles läuft.</p>`;
  }catch(e){ el.textContent='Verbindung fehlgeschlagen'; }
}

/* ---------- boot ---------- */
load();
const params = new URLSearchParams(location.search);
if(me){ renderHome(); refresh(); }
else renderJoin(params.get('g')||'');
timer = setInterval(refresh, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
